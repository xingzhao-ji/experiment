[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claw-engine"
version = "0.1.0"
description = "Claw Engine – nightly research agent that re-analyzes public datasets and reports testable findings"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "pyyaml>=6.0",
    "discord.py>=2.3",
    "docker>=7.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "agent*", "sandbox*", "datasets*", "discord_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
